<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc" style="font-family:Microsoft YaHei, Segoe UI, sans-serif;">
<title id="title">受控实验：只改变一个因素</title><desc id="desc">展示一个关于水平翻转增强的比较，其他数据、模型、预算和评价规则保持一致。</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#245B78"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2F7F89"/></marker>
<pattern id="gridline" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#E8F1F7"/><path d="M18 0H0V18" fill="none" stroke="#DFE7F1" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="510" fill="#F4F7FB"/>
<text x="40" y="42" text-anchor="start" font-size="30px" font-weight="750" fill="#245B78" style="">受控实验：只改变一个因素</text>
<rect x="45" y="78" width="910" height="68" rx="14" fill="#D9EEF0" stroke="#2F7F89" stroke-width="2"/>
<text x="500" y="121" text-anchor="middle" font-size="26px" font-weight="750" fill="#142033" style="">问题：水平翻转增强是否改变测试集 Dice？</text>
<text x="70" y="184" text-anchor="start" font-size="24px" font-weight="750" fill="#245B78" style="">两条方案共同保持</text>
<rect x="285" y="157" width="190" height="46" rx="23.0" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="380.0" y="187.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">同一数据划分</text>
<rect x="500" y="157" width="190" height="46" rx="23.0" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="595.0" y="187.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">同一模型与预算</text>
<rect x="715" y="157" width="190" height="46" rx="23.0" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="810.0" y="187.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">同一检查点规则</text>
<rect x="70" y="225" width="360" height="140" rx="16" fill="#FFFFFF" stroke="#245B78" stroke-width="3"/>
<text x="250" y="264" text-anchor="middle" font-size="24px" font-weight="750" fill="#142033" style="">方案 A：seg_base_s1</text>
<rect x="125" y="290" width="250" height="48" rx="24.0" fill="#FFF5DA" stroke="#C9912C" stroke-width="2"/>
<text x="250.0" y="322.05" text-anchor="middle" font-size="23px" font-weight="650" fill="#142033" style="">增强：无</text>
<rect x="570" y="225" width="360" height="140" rx="16" fill="#FFFFFF" stroke="#2F7F89" stroke-width="3"/>
<text x="750" y="264" text-anchor="middle" font-size="24px" font-weight="750" fill="#142033" style="">方案 B：seg_flip_s1</text>
<rect x="625" y="290" width="250" height="48" rx="24.0" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="750.0" y="322.05" text-anchor="middle" font-size="23px" font-weight="650" fill="#142033" style="">增强：水平翻转</text>
<line x1="250" y1="365" x2="250" y2="412" stroke="#245B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="750" y1="365" x2="750" y2="412" stroke="#2F7F89" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<rect x="205" y="418" width="590" height="58" rx="16" fill="#FFFFFF" stroke="#245B78" stroke-width="2"/>
<text x="500" y="454" text-anchor="middle" font-size="25px" font-weight="750" fill="#142033" style="">同一测试集 → 逐图 Dice + 固定样例对照</text>
<text x="500" y="500" text-anchor="middle" font-size="23px" font-weight="650" fill="#5D6B7F" style="">结果没有明显提升，也记录为当前条件下的证据</text>
</svg>
