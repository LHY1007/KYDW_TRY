<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc" style="font-family:Microsoft YaHei, Segoe UI, sans-serif;">
<title id="title">分类流程：图像、模型与类别</title><desc id="desc">抽象展示分类模型从 RGB 批量到两个 logits，再到预测和训练损失。</desc>
<defs>
