<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" style="font-family:Microsoft YaHei, Segoe UI, sans-serif;">
<title id="title">PPT 流程图：对象、尺寸与连接符</title><desc id="desc">展示如何把计算对象放入 16:9 幻灯片并用对齐、分布和连接符完成可编辑流程图。</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#245B78"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2F7F89"/></marker>
<pattern id="gridline" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#E8F1F7"/><path d="M18 0H0V18" fill="none" stroke="#DFE7F1" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="500" fill="#F4F7FB"/>
<text x="40" y="42" text-anchor="start" font-size="30px" font-weight="750" fill="#245B78" style="">PPT 流程图：对象、尺寸与连接符</text>
<rect x="35" y="88" width="185" height="320" rx="16" fill="#FFFFFF" stroke="#2F7F89" stroke-width="2"/>
<text x="128" y="123" text-anchor="middle" font-size="25px" font-weight="750" fill="#142033" style="">先列对象</text>
<rect x="58" y="150" width="140" height="34" rx="17.0" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="128.0" y="174.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">图像</text>
<rect x="58" y="195" width="140" height="34" rx="17.0" fill="#D9EEF0" stroke="#245B78" stroke-width="2"/>
<text x="128.0" y="219.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">张量</text>
<rect x="58" y="240" width="140" height="34" rx="17.0" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="128.0" y="264.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">模型</text>
<rect x="58" y="285" width="140" height="34" rx="17.0" fill="#D9EEF0" stroke="#245B78" stroke-width="2"/>
<text x="128.0" y="309.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">两个分数</text>
<rect x="58" y="330" width="140" height="34" rx="17.0" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="128.0" y="354.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">预测类别</text>
<line x1="222" y1="245" x2="275" y2="245" stroke="#245B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="280" y="88" width="455" height="320" rx="12" fill="#FFFFFF" stroke="#245B78" stroke-width="3"/>
<text x="507" y="120" text-anchor="middle" font-size="24px" font-weight="750" fill="#245B78" style="">16:9 宽屏页</text>
<text x="507" y="151" text-anchor="middle" font-size="22px" font-weight="500" fill="#5D6B7F" style="">每个矩形示例：3.2 cm × 1.4 cm</text>
<rect x="315" y="215" width="112" height="62" rx="10" fill="#E8F1F7" stroke="#2F7F89" stroke-width="2"/>
<text x="371" y="253" text-anchor="middle" font-size="24px" font-weight="700" fill="#142033" style="">图像</text>
<rect x="470" y="215" width="112" height="62" rx="10" fill="#D9EEF0" stroke="#2F7F89" stroke-width="2"/>
<text x="526" y="253" text-anchor="middle" font-size="24px" font-weight="700" fill="#142033" style="">模型</text>
<rect x="625" y="215" width="112" height="62" rx="10" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="681" y="253" text-anchor="middle" font-size="24px" font-weight="700" fill="#142033" style="">输出</text>
<line x1="430" y1="246" x2="462" y2="246" stroke="#2F7F89" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="585" y1="246" x2="617" y2="246" stroke="#2F7F89" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
<line x1="315" y1="305" x2="737" y2="305" stroke="#245B78" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="525" y="340" text-anchor="middle" font-size="22px" font-weight="650" fill="#245B78" style="">顶端对齐 + 横向分布</text>
<line x1="737" y1="245" x2="785" y2="245" stroke="#245B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="790" y="88" width="175" height="320" rx="16" fill="#FFFFFF" stroke="#2F7F89" stroke-width="2"/>
<text x="877" y="123" text-anchor="middle" font-size="25px" font-weight="750" fill="#142033" style="">交付检查</text>
<rect x="810" y="158" width="135" height="35" rx="9" fill="#E8F1F7" stroke="#DFE7F1" stroke-width="1"/>
<text x="877" y="182" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">连接符跟随移动</text>
<rect x="810" y="211" width="135" height="35" rx="9" fill="#E8F1F7" stroke="#DFE7F1" stroke-width="1"/>
<text x="877" y="235" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">组合 / 取消组合</text>
<rect x="810" y="264" width="135" height="35" rx="9" fill="#E9F6EF" stroke="#DFE7F1" stroke-width="1"/>
<text x="877" y="288" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">保存 PPTX</text>
<rect x="810" y="317" width="135" height="35" rx="9" fill="#E9F6EF" stroke="#DFE7F1" stroke-width="1"/>
<text x="877" y="341" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">导出 PDF 或图片</text>
<text x="500" y="457" text-anchor="middle" font-size="24px" font-weight="700" fill="#245B78" style="">箭头方向要与实际计算方向一致</text>
</svg>
