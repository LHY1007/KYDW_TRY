<circle cx="121" cy="216" r="8" fill="#554474"/><circle cx="169" cy="194" r="7" fill="#554474"/><circle cx="307" cy="193" r="9" fill="#554474"/>
<circle cx="591" cy="216" r="8" fill="#806041"/><circle cx="639" cy="194" r="7" fill="#806041"/><circle cx="777" cy="193" r="9" fill="#806041"/>
<path d="M435 193h75" stroke="#648b85" stroke-width="3"/><path d="m510 193-11-8v16z" fill="#648b85"/>
<text x="480" y="321" fill="#526979" font-family="Microsoft YaHei, sans-serif" font-size="18" text-anchor="middle">示意：比较组织边缘、空隙与局部结构，再判断这对图能否逐像素比较</text>
