<rect x="55" y="107" width="380" height="178" rx="13" fill="#f5e6ed" stroke="#decbd9" stroke-width="2"/>
<rect x="525" y="107" width="380" height="178" rx="13" fill="#eee6d7" stroke="#dcccb1" stroke-width="2"/>
