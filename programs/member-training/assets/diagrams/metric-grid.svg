<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" style="font-family:Microsoft YaHei, Segoe UI, sans-serif;">
<title id="title">Dice 与 IoU：4×4 像素算例</title><desc id="desc">展示一个 4×4 有效像素区域中的 TP、FP、FN，并给出吻合的 Dice 与 IoU 计算。</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#245B78"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2F7F89"/></marker>
<pattern id="gridline" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#E8F1F7"/><path d="M18 0H0V18" fill="none" stroke="#DFE7F1" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="560" fill="#F4F7FB"/>
<text x="40" y="42" text-anchor="start" font-size="30px" font-weight="750" fill="#245B78" style="">Dice 与 IoU：4×4 像素算例</text>
<text x="70" y="88" text-anchor="start" font-size="24px" font-weight="700" fill="#142033" style="">有效区域中的真实前景与预测前景</text>
<rect x="70" y="120" width="60" height="60" rx="4" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="100.0" y="159" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TP</text>
<rect x="130" y="120" width="60" height="60" rx="4" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="160.0" y="159" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TP</text>
<rect x="190" y="120" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="220.0" y="159" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="250" y="120" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="280.0" y="159" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="70" y="180" width="60" height="60" rx="4" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="100.0" y="219" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TP</text>
<rect x="130" y="180" width="60" height="60" rx="4" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="160.0" y="219" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">FN</text>
<rect x="190" y="180" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="220.0" y="219" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="250" y="180" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="280.0" y="219" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="70" y="240" width="60" height="60" rx="4" fill="#FFF5DA" stroke="#C9912C" stroke-width="2"/>
<text x="100.0" y="279" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">FP</text>
<rect x="130" y="240" width="60" height="60" rx="4" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="160.0" y="279" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TP</text>
<rect x="190" y="240" width="60" height="60" rx="4" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="220.0" y="279" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">FN</text>
<rect x="250" y="240" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="280.0" y="279" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="70" y="300" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="100.0" y="339" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="130" y="300" width="60" height="60" rx="4" fill="#FFF5DA" stroke="#C9912C" stroke-width="2"/>
<text x="160.0" y="339" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">FP</text>
<rect x="190" y="300" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="220.0" y="339" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<rect x="250" y="300" width="60" height="60" rx="4" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="280.0" y="339" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<text x="190" y="388" text-anchor="middle" font-size="23px" font-weight="650" fill="#5D6B7F" style="">4 × 4 有效像素</text>
<line x1="310" y1="235" x2="348" y2="235" stroke="#245B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="360" y="96" text-anchor="start" font-size="25px" font-weight="750" fill="#245B78" style="">计数</text>
<rect x="360" y="125" width="52" height="42" rx="8" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="386" y="154" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TP</text>
<text x="430" y="153" text-anchor="start" font-size="22px" font-weight="500" fill="#142033" style="">真实∩预测前景</text>
<text x="600" y="153" text-anchor="start" font-size="24px" font-weight="750" fill="#245B78" style="">= 4</text>
<rect x="360" y="185" width="52" height="42" rx="8" fill="#FFF5DA" stroke="#C9912C" stroke-width="2"/>
<text x="386" y="214" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">FP</text>
<text x="430" y="213" text-anchor="start" font-size="22px" font-weight="500" fill="#142033" style="">预测前景 / 背景</text>
<text x="600" y="213" text-anchor="start" font-size="24px" font-weight="750" fill="#245B78" style="">= 2</text>
<rect x="360" y="245" width="52" height="42" rx="8" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<text x="386" y="274" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">FN</text>
<text x="430" y="273" text-anchor="start" font-size="22px" font-weight="500" fill="#142033" style="">真实前景 / 漏掉</text>
<text x="600" y="273" text-anchor="start" font-size="24px" font-weight="750" fill="#245B78" style="">= 2</text>
<rect x="360" y="305" width="52" height="42" rx="8" fill="#FFFFFF" stroke="#DFE7F1" stroke-width="2"/>
<text x="386" y="334" text-anchor="middle" font-size="22px" font-weight="750" fill="#142033" style="">TN</text>
<text x="430" y="333" text-anchor="start" font-size="22px" font-weight="500" fill="#142033" style="">有效背景像素</text>
<text x="600" y="333" text-anchor="start" font-size="24px" font-weight="750" fill="#245B78" style="">= 8</text>
<rect x="650" y="105" width="315" height="275" rx="16" fill="#FFFFFF" stroke="#245B78" stroke-width="2"/>
<text x="680" y="145" text-anchor="start" font-size="25px" font-weight="750" fill="#245B78" style="">交集 = TP = 4</text>
<text x="680" y="192" text-anchor="start" font-size="24px" font-weight="500" fill="#142033" style="">并集 = TP+FP+FN = 8</text>
<text x="680" y="250" text-anchor="start" font-size="24px" font-weight="700" fill="#142033" style="">Dice = 2×4/(2×4+2+2)</text>
<text x="680" y="288" text-anchor="start" font-size="25px" font-weight="750" fill="#2F7F89" style="">= 8/12 = 0.667</text>
<text x="680" y="340" text-anchor="start" font-size="24px" font-weight="700" fill="#142033" style="">IoU = 4/(4+2+2)</text>
<text x="680" y="378" text-anchor="start" font-size="25px" font-weight="750" fill="#2F7F89" style="">= 4/8 = 0.500</text>
<text x="650" y="445" text-anchor="start" font-size="24px" font-weight="700" fill="#245B78" style="">大片 TN 不会直接提高前景 Dice</text>
<text x="650" y="480" text-anchor="start" font-size="23px" font-weight="500" fill="#5D6B7F" style="">评价前先固定有效区域与计分约定</text>
</svg>
