<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-labelledby="title desc">
<title id="title">小型 U-Net 的空间网格与预测过程</title><desc id="desc">128、64、32 三个空间尺寸，解码放大后拼接编码特征；输出 logits 经 Sigmoid 与阈值形成二值掩膜。</desc>
<defs><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#d9eef0"/><path d="M12 0H0V12" fill="none" stroke="#96bcc5"/></pattern><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#245b78"/></marker></defs>
<rect width="1000" height="620" fill="#f4f7fb"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#142033" font-size="21">
<text x="34" y="40" font-size="27" font-weight="700">小型 U-Net：网格尺寸与通道数量分别变化</text>
<rect x="40" y="85" width="144" height="144" fill="url(#grid)"/><text x="40" y="263">a：8 × 128 × 128</text>
<rect x="250" y="160" width="108" height="108" fill="url(#grid)"/><text x="238" y="301">b：16 × 64 × 64</text>
<rect x="440" y="240" width="72" height="72" fill="url(#grid)"/><text x="400" y="348">c：32 × 32 × 32</text>
<rect x="620" y="160" width="108" height="108" fill="url(#grid)"/><text x="594" y="301">16 × 64 × 64</text>
<rect x="810" y="85" width="144" height="144" fill="url(#grid)"/><text x="786" y="263">8 × 128 × 128</text>
<g stroke="#245b78" stroke-width="2.5" fill="none" marker-end="url(#arr)"><path d="M188 165L245 205"/><path d="M360 245L435 275"/><path d="M518 275L615 225"/><path d="M730 200L805 150"/></g>
<g stroke="#2f7f89" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"><path d="M110 85V58H885V80"/><path d="M306 160V124H674V155"/></g>
<text x="375" y="113" fill="#2f7f89">b 跳跃连接：32+16=48 通道</text><text x="600" y="377" fill="#2f7f89">a 跳跃连接：16+8=24 通道</text>
<text x="32" y="414">网格表示空间位置；每个网格叠有多张特征图。图中省略批量轴 B。</text>
<path d="M885 275V454" stroke="#245b78" stroke-width="2.5" marker-end="url(#arr)"/>
<g text-anchor="middle"><rect x="34" y="466" width="220" height="110" rx="12" fill="#e8f1f7"/><text x="144" y="496">输出 logits</text><text x="144" y="526">1 × 128 × 128</text><text x="144" y="556">可为正或负</text>
<rect x="390" y="466" width="220" height="110" rx="12" fill="#d9eef0"/><text x="500" y="496">前景概率</text><text x="500" y="526">1 × 128 × 128</text><text x="500" y="556">范围 0—1</text>
<rect x="748" y="466" width="220" height="110" rx="12" fill="#e9f6ef"/><text x="858" y="496">二值掩膜</text><text x="858" y="526">1 × 128 × 128</text><text x="858" y="556">仅有 0 或 1</text></g>
<path d="M885 454H144V461" stroke="#245b78" fill="none" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M259 525H384M615 525H742" stroke="#245b78" stroke-width="2.5" marker-end="url(#arr)"/><text x="271" y="503">Sigmoid</text><text x="645" y="503">阈值</text>
<text x="34" y="607" font-size="17">结构示意，尺寸对应项目默认 SIZE=128；网格颜色不代表真实激活值。</text></g></svg>