<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" style="font-family:Microsoft YaHei, Segoe UI, sans-serif;">
<title id="title">短报告版式：样式、图表与导出</title><desc id="desc">抽象展示 2—3 页 Word 短报告的结构、图题与交叉引用，以及导出 PDF 后的检查。</desc>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#245B78"/></marker>
<marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#2F7F89"/></marker>
<pattern id="gridline" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#E8F1F7"/><path d="M18 0H0V18" fill="none" stroke="#DFE7F1" stroke-width="1"/></pattern>
</defs>
<rect width="1000" height="560" fill="#F4F7FB"/>
<text x="40" y="42" text-anchor="start" font-size="30px" font-weight="750" fill="#245B78" style="">短报告版式：样式、图表与导出</text>
<rect x="55" y="82" width="450" height="430" rx="10" fill="#FFFFFF" stroke="#245B78" stroke-width="3"/>
<text x="280" y="116" text-anchor="middle" font-size="25px" font-weight="750" fill="#142033" style="">Word 短报告（2—3 页）</text>
<rect x="85" y="140" width="390" height="48" rx="8" fill="#E8F1F7" stroke="#DFE7F1" stroke-width="1"/>
<text x="280" y="172" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">标题 1：任务与数据</text>
<rect x="85" y="200" width="390" height="48" rx="8" fill="#D9EEF0" stroke="#DFE7F1" stroke-width="1"/>
<text x="280" y="232" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">标题 2：比较方案</text>
<rect x="85" y="264" width="180" height="125" rx="8" fill="#E8F1F7" stroke="#2F7F89" stroke-width="2"/>
<text x="175" y="298" text-anchor="middle" font-size="24px" font-weight="750" fill="#245B78" style="">图 1</text>
<rect x="110" y="323" width="105" height="14" rx="6" fill="#245B78" stroke="#245B78" stroke-width="1"/>
<rect x="110" y="347" width="87" height="14" rx="6" fill="#2F7F89" stroke="#2F7F89" stroke-width="1"/>
<text x="175" y="378" text-anchor="middle" font-size="22px" font-weight="500" fill="#5D6B7F" style="">原图｜预测</text>
<rect x="285" y="264" width="190" height="125" rx="8" fill="#FFFFFF" stroke="#2F7F89" stroke-width="2"/>
<text x="380" y="298" text-anchor="middle" font-size="24px" font-weight="750" fill="#245B78" style="">表 1</text>
<line x1="305" y1="323" x2="455" y2="323" stroke="#DFE7F1" stroke-width="2" stroke-linecap="round"/>
<line x1="305" y1="345" x2="455" y2="345" stroke="#DFE7F1" stroke-width="2" stroke-linecap="round"/>
<line x1="305" y1="367" x2="455" y2="367" stroke="#DFE7F1" stroke-width="2" stroke-linecap="round"/>
<line x1="350" y1="310" x2="350" y2="375" stroke="#DFE7F1" stroke-width="2" stroke-linecap="round"/>
<text x="380" y="378" text-anchor="middle" font-size="22px" font-weight="500" fill="#5D6B7F" style="">方案｜指标</text>
<rect x="85" y="409" width="390" height="48" rx="8" fill="#E9F6EF" stroke="#2F7F89" stroke-width="1"/>
<text x="280" y="441" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">图题 + 交叉引用 + 讨论</text>
<text x="585" y="103" text-anchor="start" font-size="25px" font-weight="750" fill="#245B78" style="">排版与交付检查</text>
<rect x="585" y="135" width="310" height="48" rx="10" fill="#E8F1F7" stroke="#DFE7F1" stroke-width="2"/>
<text x="740" y="166" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">标题样式</text>
<line x1="740" y1="184" x2="740" y2="199" stroke="#245B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="585" y="203" width="310" height="48" rx="10" fill="#D9EEF0" stroke="#DFE7F1" stroke-width="2"/>
<text x="740" y="234" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">图片与图题相邻</text>
<line x1="740" y1="252" x2="740" y2="267" stroke="#245B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="585" y="271" width="310" height="48" rx="10" fill="#E9F6EF" stroke="#DFE7F1" stroke-width="2"/>
<text x="740" y="302" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">表格列名与单位</text>
<line x1="740" y1="320" x2="740" y2="335" stroke="#245B78" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="585" y="339" width="310" height="48" rx="10" fill="#FFF5DA" stroke="#DFE7F1" stroke-width="2"/>
<text x="740" y="370" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">导出 PDF 后复查</text>
<text x="585" y="444" text-anchor="start" font-size="24px" font-weight="750" fill="#2F7F89" style="">保留：可编辑 Word + PDF</text>
<text x="585" y="482" text-anchor="start" font-size="23px" font-weight="500" fill="#5D6B7F" style="">图表数值与结果记录一致</text>
</svg>
