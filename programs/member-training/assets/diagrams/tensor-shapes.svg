<rect x="153.3" y="180.0" width="36.7" height="28.0" fill="#E3C8A9"/>
<text x="135" y="252" text-anchor="middle" font-size="24px" font-weight="700" fill="#142033" style="">RGB 图像</text>
<text x="135" y="280" text-anchor="middle" font-size="24px" font-weight="700" fill="#245B78" style="">[128,128,3]</text>
<line x1="232" y1="190" x2="286" y2="190" stroke="#245B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="295" y="88" width="190" height="205" rx="16" fill="#E8F1F7" stroke="#245B78" stroke-width="2"/>
<rect x="324" y="120" width="34" height="103" rx="6" fill="#E98F86" stroke="#FFFFFF" stroke-width="2"/>
