<text x="880" y="252" text-anchor="middle" font-size="23px" font-weight="700" fill="#142033" style="">[4,3,128,128]</text>
<text x="880" y="280" text-anchor="middle" font-size="22px" font-weight="500" fill="#5D6B7F" style="">四张一批</text>
