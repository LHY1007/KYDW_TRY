<rect x="350" y="345" width="245" height="58" rx="29.0" fill="#D9EEF0" stroke="#2F7F89" stroke-width="2"/>
<text x="472.5" y="381.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">通道维：RGB</text>
<rect x="630" y="345" width="300" height="58" rx="29.0" fill="#E9F6EF" stroke="#2F7F89" stroke-width="2"/>
<text x="780.0" y="381.7" text-anchor="middle" font-size="22px" font-weight="650" fill="#142033" style="">像素范围：0—1</text>
<text x="500" y="460" text-anchor="middle" font-size="24px" font-weight="700" fill="#245B78" style="">注意：换维度与改图片大小是两件事</text>
</svg>
