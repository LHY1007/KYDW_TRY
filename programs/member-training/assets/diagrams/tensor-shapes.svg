<line x1="487" y1="190" x2="541" y2="190" stroke="#245B78" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="550" y="88" width="190" height="205" rx="16" fill="#D9EEF0" stroke="#2F7F89" stroke-width="2"/>
<rect x="580" y="119" width="112" height="26" rx="6" fill="#E98F86" stroke="#FFFFFF" stroke-width="2"/>
