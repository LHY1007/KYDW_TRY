<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 550" role="img"><title>相同像素的存储空间：float32 是 uint8 的四倍</title><g font-family="Microsoft YaHei,Arial,sans-serif"><rect x="0" y="0" width="1040" height="550" fill="white" stroke="none" stroke-width="1"/><text x="30" y="38" font-size="24" text-anchor="start" fill="#203e3d">同一个 RGB 像素，颜色不变，存储空间不同</text><rect x="30" y="78" width="95" height="95" fill="rgb(178,138,89)" stroke="none" stroke-width="1"/><text x="145" y="108" font-size="21" text-anchor="start" fill="#203e3d">RGB = (178, 138, 89)</text><text x="145" y="144" font-size="18" text-anchor="start" fill="#203e3d">每个小格表示 1 字节；相邻格子表示存储空间。</text><text x="30" y="248" font-size="22" text-anchor="start" fill="#203e3d">uint8</text><rect x="185" y="223" width="46" height="38" fill="#b26054" stroke="none" stroke-width="1"/><rect x="236" y="223" width="46" height="38" fill="#519077" stroke="none" stroke-width="1"/><rect x="287" y="223" width="46" height="38" fill="#5076a5" stroke="none" stroke-width="1"/><text x="822" y="249" font-size="22" text-anchor="start" fill="#203e3d">3 字节</text><text x="30" y="335" font-size="22" text-anchor="start" fill="#203e3d">float32</text><rect x="185" y="310" width="46" height="38" fill="#b26054" stroke="none" stroke-width="1"/><rect x="236" y="310" width="46" height="38" fill="#b26054" stroke="none" stroke-width="1"/><rect x="287" y="310" width="46" height="38" fill="#b26054" stroke="none" stroke-width="1"/><rect x="338" y="310" width="46" height="38" fill="#b26054" stroke="none" stroke-width="1"/><rect x="389" y="310" width="46" height="38" fill="#519077" stroke="none" stroke-width="1"/><rect x="440" y="310" width="46" height="38" fill="#519077" stroke="none" stroke-width="1"/><rect x="491" y="310" width="46" height="38" fill="#519077" stroke="none" stroke-width="1"/><rect x="542" y="310" width="46" height="38" fill="#519077" stroke="none" stroke-width="1"/><rect x="593" y="310" width="46" height="38" fill="#5076a5" stroke="none" stroke-width="1"/><rect x="644" y="310" width="46" height="38" fill="#5076a5" stroke="none" stroke-width="1"/><rect x="695" y="310" width="46" height="38" fill="#5076a5" stroke="none" stroke-width="1"/><rect x="746" y="310" width="46" height="38" fill="#5076a5" stroke="none" stroke-width="1"/><text x="822" y="336" font-size="22" text-anchor="start" fill="#203e3d">12 字节</text><text x="30" y="404" font-size="22" text-anchor="start" fill="#203e3d">256 × 256 个像素：196608 个颜色数值</text><rect x="185" y="438" width="180" height="27" fill="#68a296" stroke="none" stroke-width="1"/><text x="30" y="459" font-size="19" text-anchor="start" fill="#203e3d">uint8</text><text x="377" y="459" font-size="19" text-anchor="start" fill="#203e3d">192 KiB</text><rect x="185" y="485" width="720" height="27" fill="#315e75" stroke="none" stroke-width="1"/><text x="30" y="506" font-size="19" text-anchor="start" fill="#203e3d">float32</text><text x="914" y="506" font-size="19" text-anchor="start" fill="#203e3d">768 KiB</text></g></svg>